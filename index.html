<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Meta Tags -->
  <title>Online Photo & Signature Resizer for Govt Exams (SSC, UPSC, IBPS, State PSC)</title>
  <meta name="description" content="Free online tool to resize and compress photos under 50KB and signatures under 20KB for SSC CGL, UPSC, IBPS, Police, and government exams. Secure, fast, and processed right inside your browser." />
  <meta name="keywords" content="photo resizer 50kb, signature compressor 20kb, ssc photo resize, upsc signature resizer, ibps document resizer, exam photo compressor" />
  <meta name="author" content="ExamDocsResizer" />

  <!-- Monetag Ad Tag -->
  <meta name="monetag" content="YOUR_MONETAG_TAG_HERE" />

  <!-- Favicon Links for Browser Tabs & Google Search -->
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      padding: 28px 20px;
      border: 1px solid var(--border);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .upload-box {
      border: 2px dashed #93c5fd;
      background: #eff6ff;
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .upload-box:hover {
      background: #dbeafe;
      border-color: var(--primary);
    }

    .upload-box input[type="file"] {
      display: none;
    }

    .upload-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .upload-text {
      font-weight: 600;
      color: var(--primary);
      font-size: 1rem;
    }

    .upload-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .presets-container {
      margin-top: 20px;
    }

    .presets-label {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
      display: block;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .preset-btn {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: left;
      transition: all 0.15s ease-in-out;
    }

    .preset-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
      font-weight: 600;
    }

    .preset-btn span {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-compress {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-compress:hover {
      background: var(--primary-hover);
    }

    .btn-compress:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-card h3 {
      font-size: 1.25rem;
      color: #16a34a;
      margin-bottom: 8px;
    }

    .file-stat {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .btn-download {
      width: 100%;
      padding: 13px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: #15803d;
    }

    .btn-download:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .modal-close {
      margin-top: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    footer {
      margin-top: auto;
      padding: 20px 0 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ExamDocsResizer</h1>
      <p>Compress passport photos & signatures strictly under exam KB limits</p>
    </header>

    <!-- Upload Section -->
    <div class="upload-box" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📸</div>
      <div class="upload-text" id="uploadLabel">Choose or drop document image</div>
      <div class="upload-sub">Supports JPG, PNG & WEBP (Client-Side, Safe)</div>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <!-- Exam Presets -->
    <div class="presets-container">
      <label class="presets-label">Select Exam Target Specification:</label>
      <div class="preset-grid">
        <button type="button" class="preset-btn active" data-max="50" data-w="350" data-h="450">
          Photo (Max 50KB)
          <span>SSC, UPSC, IBPS, State PSC</span>
        </button>
        <button type="button" class="preset-btn" data-max="20" data-w="300" data-h="150">
          Signature (Max 20KB)
          <span>Standard 10KB - 20KB limit</span>
        </button>
        <button type="button" class="preset-btn" data-max="100" data-w="600" data-h="800">
          Certificate (Max 100KB)
          <span>Marksheet / ID Proof</span>
        </button>
        <button type="button" class="preset-btn" data-max="300" data-w="800" data-h="1000">
          Document (Max 300KB)
          <span>UPSC & Police recruits</span>
        </button>
      </div>
    </div>

    <!-- Action Button -->
    <button type="button" id="compressBtn" class="btn-compress" disabled>Select an Image First</button>
  </div>

  <!-- Download & Monetization Modal -->
  <div class="modal-overlay" id="downloadModal">
    <div class="modal-card">
      <h3>✓ Compression Ready!</h3>
      <p class="file-stat" id="resultStats">Result: Calculating size...</p>
      
      <button type="button" id="downloadBtn" class="btn-download" disabled>
        Please wait (5s)...
      </button>

      <div>
        <button type="button" class="modal-close" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <footer>
    100% Client-Side Processing • Your images are never saved to any external server.
  </footer>

  <script>
    // --- REPLACE THIS WITH YOUR MONETAG SMARTLINK ---
    const MONETAG_SMARTLINK = "https://uplcm.com/your-smartlink-here";

    const fileInput = document.getElementById('fileInput');
    const uploadLabel = document.getElementById('uploadLabel');
    const compressBtn = document.getElementById('compressBtn');
    const presetBtns = document.querySelectorAll('.preset-btn');
    const downloadModal = document.getElementById('downloadModal');
    const downloadBtn = document.getElementById('downloadBtn');
    const resultStats = document.getElementById('resultStats');

    let currentFile = null;
    let compressedBlob = null;
    let selectedPreset = { maxKB: 50, w: 350, h: 450 };

    // Preset Selection Handler
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedPreset = {
          maxKB: parseInt(btn.dataset.max),
          w: parseInt(btn.dataset.w),
          h: parseInt(btn.dataset.h)
        };
      });
    });

    // File Input Listener
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        currentFile = e.target.files[0];
        uploadLabel.textContent = `Selected: ${currentFile.name}`;
        compressBtn.disabled = false;
        compressBtn.textContent = 'Compress Image';
      }
    });

    // Compression Engine (Runs entirely inside the browser canvas)
    compressBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      compressBtn.disabled = true;
      compressBtn.textContent = 'Processing...';

      const img = new Image();
      img.src = URL.createObjectURL(currentFile);

      img.onload = async () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        // Resize proportionally if larger than preset dimensions
        if (width > selectedPreset.w || height > selectedPreset.h) {
          const ratio = Math.min(selectedPreset.w / width, selectedPreset.h / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        // Binary Search iteration to guarantee file falls strictly below maxKB
        let minQuality = 0.05;
        let maxQuality = 0.95;
        let bestBlob = null;

        for (let i = 0; i < 6; i++) {
          const midQuality = (minQuality + maxQuality) / 2;
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', midQuality));
          const sizeKB = blob.size / 1024;

          if (sizeKB <= selectedPreset.maxKB) {
            bestBlob = blob;
            minQuality = midQuality; // Try higher quality
          } else {
            maxQuality = midQuality; // Lower quality to meet limit
          }
        }

        if (!bestBlob) {
          bestBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.1));
        }

        compressedBlob = bestBlob;
        const finalKB = (compressedBlob.size / 1024).toFixed(1);
        resultStats.textContent = `Original: ${(currentFile.size / 1024).toFixed(1)} KB ➔ Compressed: ${finalKB} KB (Target: ≤ ${selectedPreset.maxKB} KB)`;

        compressBtn.disabled = false;
        compressBtn.textContent = 'Compress Image';
        showDownloadModal();
      };
    });

    // Modal & 5-Second Countdown
    function showDownloadModal() {
      downloadModal.style.display = 'flex';
      let countdown = 5;
      downloadBtn.disabled = true;
      downloadBtn.textContent = `Please wait (${countdown}s)...`;

      const timer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          downloadBtn.textContent = `Please wait (${countdown}s)...`;
        } else {
          clearInterval(timer);
          downloadBtn.disabled = false;
          downloadBtn.textContent = '⬇️ Download Compressed Document';
        }
      }, 1000);
    }

    function closeModal() {
      downloadModal.style.display = 'none';
    }

    // Download & Ad Trigger
    downloadBtn.addEventListener('click', () => {
      if (!compressedBlob) return;

      // 1. Download file directly
      const a = document.createElement('a');
      a.href = URL.createObjectURL(compressedBlob);
      a.download = `ExamResized_${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // 2. Open Monetag Ad link in background/new tab
      if (MONETAG_SMARTLINK && !MONETAG_SMARTLINK.includes("your-smartlink-here")) {
        window.open(MONETAG_SMARTLINK, '_blank');
      }

      closeModal();
    });
  </script>
</body>
</html>
